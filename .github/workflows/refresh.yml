name: Daily refresh

on:
  schedule:
    # 12:00 UTC daily (after FRED weekly drops Thursdays and after MND posts).
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Needed for the post-failure notifier step: it opens a GitHub issue when
  # a scheduled (cron) run fails, so a silent overnight break leaves a paper
  # trail in the repo issues tab instead of dying invisibly in the Actions log.
  issues: write
  # Needed for the final "Trigger Pages deploy" step: GITHUB_TOKEN can
  # dispatch a workflow_dispatch event ONLY if the workflow declares
  # actions: write. Without this the gh CLI call gets HTTP 403 "Resource
  # not accessible by integration" and the live site keeps serving the
  # bundle from the last *human* push (data goes stale).
  actions: write

# Run JS-based actions on Node 24. Required from June 16, 2026; opting in early
# eliminates the Node 20 deprecation warning. https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Path used by every step to record per-component failures. Read by the summary step.
  FAIL_LOG: ${{ github.workspace }}/.refresh-failures.log

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung Playwright Chromium or wedged urllib socket
    # can't burn an entire 6-hour default budget — and quietly drain the
    # Actions monthly minutes allowance with it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Cache pip's wheel cache keyed on requirements.txt. When the file
          # hasn't changed (the common case for a daily cron), the install
          # step pulls wheels from cache instead of PyPI — ~15-25s saved per
          # run and one fewer external dependency to fail on.
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Init failure log
        run: |
          : > "$FAIL_LOG"

      - run: python -m pip install --upgrade pip

      - name: Install Python deps
        run: pip install -r requirements.txt || echo "pip-install failed" >> "$FAIL_LOG"

      # Deliberately placed here: AFTER the deps are available but BEFORE any
      # network work. If the aggregation math is broken we must not publish,
      # and failing at this point costs nothing — no fetcher has run, so there
      # is no half-collected data to discard. This step is NOT fail-soft: a
      # red suite means the code that computes every published number is
      # wrong, which is categorically different from one flaky upstream page.
      - name: Pipeline unit tests
        run: python -m pytest scripts/tests -q

      # Playwright's Chromium binary is ~170 MB. Caching it keyed on
      # requirements.txt (which pins the Playwright version) skips the
      # full download/install on every run where the version hasn't moved —
      # typically saving ~45-60s. The "Install Playwright Chromium" step
      # below is then gated on a cache miss.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium || echo "playwright-install failed" >> "$FAIL_LOG"

      - name: Install Playwright OS deps (cache-hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # When the browser binary itself is cached, we still need the
        # apt-level shared libs Chromium links against (libnss3, libxkbcommon0,
        # etc.) on a fresh runner — the binary alone isn't enough. This is
        # a no-op for the binary but ensures system libs are present.
        run: python -m playwright install-deps chromium || echo "playwright-deps failed" >> "$FAIL_LOG"

      - name: Discover active states
        id: states
        run: |
          set -e
          # `find -type d`, not `ls`: ls lists any stray FILE under
          # src/data/states as if it were a state slug, and it exits 0 even
          # when the directory is missing entirely (the `2>/dev/null` hid the
          # error). An empty slug list then flowed into every fetch loop and
          # the validator, making the whole run a silent no-op that still
          # printed "coverage check passed" over zero states.
          slugs=$(find src/data/states -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ')
          if [ -z "${slugs// /}" ]; then
            echo "::error::No state directories found under src/data/states — refusing to run a zero-state refresh."
            exit 1
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Active states: $slugs"

      - name: Fetch FRED PMMS (national)
        env:
          # Optional but strongly recommended. When unset the script silently
          # skips the API tier and falls back to the (flaky) public CSV+HTML
          # endpoints. Register a free key at
          # https://fred.stlouisfed.org/docs/api/api_key.html and add as a
          # repo secret named FRED_API_KEY.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/fetch_fred.py || echo "fred" >> "$FAIL_LOG"

      - name: Fetch Rocket Mortgage (national)
        run: |
          python scripts/fetch_rocket.py || echo "rocket" >> "$FAIL_LOG"
          python scripts/aggregate_rocket.py || echo "aggregate-rocket" >> "$FAIL_LOG"

      # NOTE on `timeout` (all three per-state loops): each fetcher already
      # budgets its own retries, and these wrappers are deliberately set ABOVE
      # those budgets. Bankrate's worst legitimate path is 3 Playwright
      # attempts of 60s goto + 45s hydration with 4s/12s backoffs (~331s),
      # then the static tier (30s) and the Wayback CDX + snapshot tier
      # (30s + 60s) — ~451s all told. MND/NerdWallet go through
      # scripts/_http.py: 3 attempts of 30s plus the same backoffs (~106s).
      # The wrappers exist to kill a genuinely WEDGED socket or browser (the
      # unbounded case that turns one site-wide slowdown into a multi-hour
      # job), NOT to preempt a retry the fetcher was designed to make — a
      # tighter cap would convert states that recover on attempt 2 or 3 into
      # permanent lost days. `timeout` exits 124 on expiry, which the existing
      # `|| echo` path records in FAIL_LOG like any other failure, so after
      # the expected-failure allowlist below an expired state is NAMED in the
      # commit subject instead of vanishing into "(partial: N)".
      - name: Fetch Bankrate live per state
        env:
          # Passed through env rather than interpolated into the script body:
          # a `${{ }}` expression is substituted as TEXT before bash parses the
          # line, so anything that ever reaches the slug list could inject
          # shell. As an env var it is data, never code.
          STATE_SLUGS: ${{ steps.states.outputs.slugs }}
        run: |
          for s in $STATE_SLUGS; do
            echo "::group::Bankrate $s"
            timeout 480 python scripts/fetch_bankrate_state.py --state "$s" || echo "bankrate:$s" >> "$FAIL_LOG"
            sleep 4
            echo "::endgroup::"
          done

      - name: Fetch MND live per state
        env:
          STATE_SLUGS: ${{ steps.states.outputs.slugs }}
        run: |
          for s in $STATE_SLUGS; do
            echo "::group::MND $s"
            timeout 150 python scripts/fetch_mnd_state.py --state "$s" || echo "mnd:$s" >> "$FAIL_LOG"
            sleep 2
            echo "::endgroup::"
          done

      - name: Fetch NerdWallet live per state
        env:
          STATE_SLUGS: ${{ steps.states.outputs.slugs }}
        run: |
          for s in $STATE_SLUGS; do
            echo "::group::NerdWallet $s"
            timeout 150 python scripts/fetch_nerdwallet_state.py --state "$s" || echo "nerdwallet:$s" >> "$FAIL_LOG"
            sleep 2
            echo "::endgroup::"
          done

      - name: Aggregate + reconcile per state
        env:
          STATE_SLUGS: ${{ steps.states.outputs.slugs }}
        run: |
          for s in $STATE_SLUGS; do
            echo "::group::Aggregate $s"
            python scripts/aggregate_mnd_state.py --state "$s" || echo "aggregate-mnd:$s" >> "$FAIL_LOG"
            python scripts/aggregate_nerdwallet_state.py --state "$s" || echo "aggregate-nerdwallet:$s" >> "$FAIL_LOG"
            python scripts/reconcile_state.py --state "$s" || echo "reconcile:$s" >> "$FAIL_LOG"
            python scripts/emit_daily_view.py --state "$s" || echo "daily-view:$s" >> "$FAIL_LOG"
            echo "::endgroup::"
          done

      - name: Build states index + sitemap
        run: |
          python scripts/build_states_index.py || echo "states-index" >> "$FAIL_LOG"
          python scripts/build_sitemap.py || echo "sitemap" >> "$FAIL_LOG"

      # Splits FAIL_LOG into EXPECTED (known, permanent, already-understood)
      # and UNEXPECTED failures, and exports the split for the validator's
      # step summary and the commit-message tag.
      #
      # WHY: `rocket` lands in FAIL_LOG on literally every run by design —
      # Akamai denylists GitHub's datacenter IPs, so the feed is refreshed
      # weekly from a residential IP instead (scripts/rocket_residential_refresh.ps1).
      # That pinned every commit subject at "(partial: 1 failure(s))", a
      # permanently-saturated signal: when a REAL second failure occurred
      # (nerdwallet:maine, 2026-07-31) the tag read "(partial: 2 failure(s))",
      # nobody could tell it apart from the daily noise, and that state
      # permanently lost a day of its series behind a green run with no issue.
      # Expected failures now stay VISIBLE (a "known-expected:" line) but stop
      # counting; only unexpected ones raise ::error:: and name themselves in
      # the commit subject.
      - name: Summarize partial failures
        if: always()
        env:
          # Hardcoded rather than read from a repo variable so the allowlist is
          # reviewable in the diff and cannot be widened without a commit.
          # One component per line, matched as a WHOLE line (grep -x -F), so
          # `rocket` never accidentally allowlists `aggregate-rocket`.
          EXPECTED_FAILURES: |
            rocket
        run: |
          exp_file="${RUNNER_TEMP:-/tmp}/expected-failures.txt"
          unexp_file="${RUNNER_TEMP:-/tmp}/unexpected-failures.txt"
          printf '%s\n' "$EXPECTED_FAILURES" | sed '/^[[:space:]]*$/d' > "$exp_file"
          : > "$unexp_file"
          expected_seen=""
          if [ -s "$FAIL_LOG" ]; then
            # `|| true` on both greps: grep exits 1 when nothing matches, which
            # under the runner's default `bash -e` would abort the step on the
            # happy path (no unexpected failures at all).
            grep -vxF -f "$exp_file" "$FAIL_LOG" | sort -u > "$unexp_file" || true
            expected_seen=$(grep -xF -f "$exp_file" "$FAIL_LOG" | sort -u | paste -sd, - || true)
          fi
          unexpected=$(wc -l < "$unexp_file" | tr -d ' ')
          unexpected_list=$(paste -sd, - < "$unexp_file" || true)

          if [ "$unexpected" -gt 0 ]; then
            # ::error:: not ::warning:: — an unexpected failure means a source
            # lost today's observation and nobody will refetch it.
            echo "::error::Daily refresh had $unexpected UNEXPECTED component failure(s): $unexpected_list"
          fi
          if [ -n "$expected_seen" ]; then
            echo "known-expected: $expected_seen"
          fi
          if [ -s "$FAIL_LOG" ]; then
            echo "Full failure log:"
            cat "$FAIL_LOG"
            echo ""
            echo "Total lines: $(wc -l < "$FAIL_LOG") (unexpected: $unexpected)"
          else
            echo "Daily refresh: no component-level failures."
          fi

          # Exported for the "Validate daily coverage" summary table and the
          # "Commit refreshed data" subject line, so the split is computed once.
          {
            echo "UNEXPECTED_FAILURE_COUNT=$unexpected"
            echo "UNEXPECTED_FAILURE_LIST=$unexpected_list"
            echo "EXPECTED_FAILURE_LIST=$expected_seen"
          } >> "$GITHUB_ENV"

      - name: Validate daily coverage
        if: always()
        env:
          # When set to "1" (e.g. via workflow_dispatch input later), the
          # validator fails the job if too many sources are missing or
          # stale. Default is permissive (warn-only) because partial coverage
          # is a normal outcome — one state's bot challenge shouldn't tank
          # the whole run. Threshold lives in STRICT_THRESHOLD below.
          STRICT_COVERAGE: ${{ vars.STRICT_COVERAGE || '0' }}
          STRICT_THRESHOLD: '20'   # percent of source-state cells allowed to be missing/stale
          # Data, not code — see the note on the Bankrate fetch step.
          STATE_SLUGS: ${{ steps.states.outputs.slugs }}
        run: |
          today=$(date -u +%Y-%m-%d)
          yesterday=$(date -u -d 'yesterday' +%Y-%m-%d)
          curr_month=$(date -u +%Y-%m)
          prev_month=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          bk_missing=()
          bk_stale=()
          mnd_missing=()
          mnd_stale=()
          nw_missing=()
          nw_stale=()
          state_count=0
          # NerdWallet's per-state page exists for every state but the rate
          # widgets never populate for these. The fetcher exits 0 for them
          # (scripts/fetch_nerdwallet_state.py KNOWN_NO_COVERAGE) — keep this
          # list in sync so the validator stops warning about their old rows.
          NW_NO_COVERAGE=" nevada "
          # Bankrate returns HTTP 404 for these slugs (no per-state page
          # exists). The fetcher exits 0 for them
          # (scripts/fetch_bankrate_state.py KNOWN_NO_COVERAGE) — keep this
          # list in sync so the validator stops warning about the empty file.
          BANKRATE_NO_COVERAGE=" district-of-columbia "
          for s in $STATE_SLUGS; do
            state_count=$((state_count + 1))
            bf="src/data/states/$s/bankrate_30yr_daily.json"
            mf="src/data/states/$s/mnd_30yr_daily.json"
            # NerdWallet doesn't have a *_daily.json view (no daily-trail in
            # the chart); validate the JSONL accumulator's last row instead.
            nwf="data/daily/nerdwallet_$s.jsonl"
            if [[ "$BANKRATE_NO_COVERAGE" == *" $s "* ]]; then
              :
            elif [ -f "$bf" ]; then
              # `|| echo ""`: jq exits non-zero on malformed JSON, and under
              # the runner's default `bash -e` a bare assignment from a failing
              # command substitution ABORTS this whole step. "Commit refreshed
              # data" carries no `if:`, so it was skipped too and the entire
              # day's fetch was discarded over one unreadable file. Falling
              # back to "" routes the file into the existing *_missing bucket,
              # which is what an unreadable file actually is.
              last=$(jq -r '.[-1].date // ""' "$bf" 2>/dev/null || echo "")
              if [ -z "$last" ]; then
                bk_missing+=("$s")
              elif [ "$last" != "$today" ] && [ "$last" != "$yesterday" ]; then
                bk_stale+=("$s=$last")
              fi
            else
              bk_missing+=("$s")
            fi
            if [ -f "$mf" ]; then
              # See the `|| echo ""` note above.
              last=$(jq -r '.[-1].date // ""' "$mf" 2>/dev/null || echo "")
              if [ -z "$last" ]; then
                mnd_missing+=("$s")
              elif [ "$last" != "$today" ] && [ "$last" != "$yesterday" ]; then
                mnd_stale+=("$s=$last")
              fi
            else
              mnd_missing+=("$s")
            fi
            if [ -f "$nwf" ]; then
              # Skip known-no-coverage states — their JSONL is a Wayback
              # backfill artifact, not something today's fetcher updates.
              if [[ "$NW_NO_COVERAGE" == *" $s "* ]]; then
                :
              else
                # See the `|| echo ""` note above.
                last=$(tail -1 "$nwf" | jq -r '.date_iso // ""' 2>/dev/null || echo "")
                if [ -z "$last" ]; then
                  nw_missing+=("$s")
                elif [ "$last" != "$today" ] && [ "$last" != "$yesterday" ]; then
                  nw_stale+=("$s=$last")
                fi
              fi
            else
              # No NW JSONL yet: tolerated for states where today's first
              # fetch hasn't written one.
              :
            fi
          done

          # ----- Per-source fetcher-failure count from FAIL_LOG -----
          # The fail log carries one line per failed component invocation:
          # `rocket`, `fred`, `bankrate:<slug>`, `mnd:<slug>`,
          # `nerdwallet:<slug>`, `aggregate-*`, etc. A non-zero count here
          # means *today's fetch step itself errored* — separate signal
          # from "the JSONL last row is yesterday" (which the file-mtime
          # checks above measure). The "Fetched today" column in the
          # summary uses these counts.
          rocket_failed_today=0
          fred_failed_today=0
          bk_failed_today=0
          mnd_failed_today=0
          nw_failed_today=0
          if [ -s "$FAIL_LOG" ]; then
            # grep -c always prints the count to stdout (even "0") and exits
            # 1 when no matches. `|| true` swallows the exit-1 without
            # appending a second "0" line to the captured value, which would
            # otherwise break the arithmetic substitutions below.
            rocket_failed_today=$(grep -c '^rocket$' "$FAIL_LOG" 2>/dev/null || true)
            fred_failed_today=$(grep -c '^fred$' "$FAIL_LOG" 2>/dev/null || true)
            bk_failed_today=$(grep -c '^bankrate:' "$FAIL_LOG" 2>/dev/null || true)
            mnd_failed_today=$(grep -c '^mnd:' "$FAIL_LOG" 2>/dev/null || true)
            nw_failed_today=$(grep -c '^nerdwallet:' "$FAIL_LOG" 2>/dev/null || true)
          fi
          # Denominators exclude the states the fetcher deliberately skips, so
          # the summary stops reporting "51/51 fetched" for a source that only
          # ever attempts 50. Derived by counting the NO_COVERAGE lists above
          # rather than hardcoding 1, so adding a slug to a list updates the
          # denominator with it.
          bk_expected=$((state_count - $(echo $BANKRATE_NO_COVERAGE | wc -w)))
          nw_expected=$((state_count - $(echo $NW_NO_COVERAGE | wc -w)))
          mnd_expected=$state_count
          bk_fetched_today=$((bk_expected - bk_failed_today))
          mnd_fetched_today=$((mnd_expected - mnd_failed_today))
          nw_fetched_today=$((nw_expected - nw_failed_today))

          # Rocket is national (single JSONL, no per-state loop).
          rk_status="ok"
          rkf="data/daily/rocket.jsonl"
          if [ -f "$rkf" ]; then
            # See the `|| echo ""` note above.
            last=$(tail -1 "$rkf" | jq -r '.date_iso // ""' 2>/dev/null || echo "")
            if [ -z "$last" ]; then
              rk_status="missing (no rows)"
            elif [ "$last" != "$today" ] && [ "$last" != "$yesterday" ]; then
              rk_status="stale (last=$last)"
            fi
          else
            rk_status="missing (no file)"
          fi

          # PMMS (Freddie Mac Primary Mortgage Market Survey) is the national
          # monthly anchor for the chart. It's published weekly and aggregated
          # to a monthly mean. The newest .month entry should always be the
          # current calendar month (mid-month onward) or the previous one
          # (early in a new month before this week's PMMS lands).
          pmms_status_30="ok"
          pmms_status_15="ok"
          for term in 30 15; do
            pf="src/data/pmms_${term}yr_monthly.json"
            if [ -f "$pf" ]; then
              # See the `|| echo ""` note above.
              last=$(jq -r '.[-1].month // ""' "$pf" 2>/dev/null || echo "")
              if [ -z "$last" ]; then
                status_val="missing (no rows)"
              elif [ "$last" != "$curr_month" ] && [ "$last" != "$prev_month" ]; then
                status_val="stale (last=$last)"
              else
                status_val="ok"
              fi
            else
              status_val="missing (no file)"
            fi
            if [ "$term" = "30" ]; then pmms_status_30="$status_val"; else pmms_status_15="$status_val"; fi
          done

          ok=true
          if [ ${#bk_missing[@]} -gt 0 ]; then
            echo "::warning::Bankrate daily files missing/empty: ${bk_missing[*]}"
            ok=false
          fi
          if [ ${#bk_stale[@]} -gt 0 ]; then
            echo "::warning::Bankrate daily files stale (last row >1 day old): ${bk_stale[*]}"
            ok=false
          fi
          if [ ${#mnd_missing[@]} -gt 0 ]; then
            echo "::warning::MND daily files missing/empty: ${mnd_missing[*]}"
            ok=false
          fi
          if [ ${#mnd_stale[@]} -gt 0 ]; then
            echo "::warning::MND daily files stale (last row >1 day old): ${mnd_stale[*]}"
            ok=false
          fi
          if [ ${#nw_missing[@]} -gt 0 ]; then
            echo "::warning::NerdWallet JSONLs missing/empty (had row, now blank): ${nw_missing[*]}"
            ok=false
          fi
          if [ ${#nw_stale[@]} -gt 0 ]; then
            echo "::warning::NerdWallet JSONLs stale (last row >1 day old): ${nw_stale[*]}"
            ok=false
          fi
          if [ "$rk_status" != "ok" ]; then
            echo "::warning::Rocket Mortgage JSONL: $rk_status"
            ok=false
          fi
          if [ "$pmms_status_30" != "ok" ]; then
            echo "::warning::PMMS 30-yr monthly: $pmms_status_30"
            ok=false
          fi
          if [ "$pmms_status_15" != "ok" ]; then
            echo "::warning::PMMS 15-yr monthly: $pmms_status_15"
            ok=false
          fi
          # Loud signal for nationals when *today's* fetcher failed even
          # though the JSONL still has yesterday's row passing the staleness
          # rule. Without this the run page reports "Rocket ok" while
          # tomorrow's run will find the same row stale. Same logic for
          # FRED — a missed weekly drop today doesn't immediately show in
          # the monthly file if the prior week already landed.
          if [ "$rocket_failed_today" -gt 0 ]; then
            echo "::warning::Rocket Mortgage fetcher failed today (JSONL last row=$rk_status); next run will mark it stale"
            ok=false
          fi
          if [ "$fred_failed_today" -gt 0 ]; then
            echo "::warning::FRED PMMS fetcher failed today (PMMS 30=$pmms_status_30 / 15=$pmms_status_15)"
            ok=false
          fi
          # The `state_count -gt 0` guard is the second half of the discovery
          # fix: without it a zero-state run trips none of the per-state checks
          # above (every array is empty) and prints an all-clear over a run
          # that validated nothing at all.
          if [ "$state_count" -eq 0 ]; then
            echo "::error::Validator saw 0 states — nothing was checked; refusing to report an all-clear."
            ok=false
          fi
          if $ok; then
            echo "Daily coverage check passed: every tracked source has a recent row."
          fi

          # ----- $GITHUB_STEP_SUMMARY markdown table -----
          # Surfaces the run's coverage health on the workflow run page (not
          # buried in step logs). Counts per source come straight from the
          # arrays above; PMMS is one row each because it's national-monthly.
          bk_m=${#bk_missing[@]}; bk_s=${#bk_stale[@]}
          mnd_m=${#mnd_missing[@]}; mnd_s=${#mnd_stale[@]}
          nw_m=${#nw_missing[@]};  nw_s=${#nw_stale[@]}
          {
            echo "## Daily refresh — coverage summary"
            echo ""
            echo "**Date (UTC):** $today"
            echo "**Tracked states:** $state_count"
            # Unexpected-only count, computed once in "Summarize partial
            # failures" and passed through $GITHUB_ENV. The expected ones stay
            # on their own line so a permanent, understood failure is still
            # VISIBLE without saturating the number anyone actually reads.
            if [ "${UNEXPECTED_FAILURE_COUNT:-0}" -gt 0 ]; then
              echo "**Component failures (unexpected):** ${UNEXPECTED_FAILURE_COUNT} — ${UNEXPECTED_FAILURE_LIST}"
            else
              echo "**Component failures (unexpected):** 0"
            fi
            if [ -n "${EXPECTED_FAILURE_LIST:-}" ]; then
              echo ""
              echo "known-expected: ${EXPECTED_FAILURE_LIST}"
            fi
            echo ""
            # "Fetched today" — what *today's* fetcher step actually
            # accomplished. Distinct from the on-disk staleness columns
            # which can pass on yesterday's row even when today's fetcher
            # failed outright.
            rk_today=$( [ "$rocket_failed_today" -eq 0 ] && echo "yes" || echo "NO" )
            fred_today=$( [ "$fred_failed_today" -eq 0 ] && echo "yes" || echo "NO" )
            echo "| Source | Scope | Fetched today | Missing | Stale (>1d) | Status |"
            echo "|---|---|:--:|---:|---:|---|"
            echo "| Bankrate | per state | $bk_fetched_today/$bk_expected | $bk_m | $bk_s | $( [ $bk_m -eq 0 ] && [ $bk_s -eq 0 ] && echo OK || echo WARN ) |"
            echo "| MND | per state | $mnd_fetched_today/$mnd_expected | $mnd_m | $mnd_s | $( [ $mnd_m -eq 0 ] && [ $mnd_s -eq 0 ] && echo OK || echo WARN ) |"
            echo "| NerdWallet | per state | $nw_fetched_today/$nw_expected | $nw_m | $nw_s | $( [ $nw_m -eq 0 ] && [ $nw_s -eq 0 ] && echo OK || echo WARN ) |"
            echo "| Rocket | national | $rk_today | - | - | $rk_status |"
            echo "| PMMS 30-yr | national-monthly | $fred_today | - | - | $pmms_status_30 |"
            echo "| PMMS 15-yr | national-monthly | $fred_today | - | - | $pmms_status_15 |"
            echo ""
            if [ $bk_m -gt 0 ] || [ $bk_s -gt 0 ]; then
              echo "**Bankrate problem states:** ${bk_missing[*]} ${bk_stale[*]}"
            fi
            if [ $mnd_m -gt 0 ] || [ $mnd_s -gt 0 ]; then
              echo "**MND problem states:** ${mnd_missing[*]} ${mnd_stale[*]}"
            fi
            if [ $nw_m -gt 0 ] || [ $nw_s -gt 0 ]; then
              echo "**NerdWallet problem states:** ${nw_missing[*]} ${nw_stale[*]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ----- STRICT_COVERAGE gate -----
          # Total "cells" we track = 3 sources × N states + 3 nationals (rocket
          # + 2 PMMS terms). If the share of broken cells exceeds the
          # threshold and STRICT_COVERAGE=1, fail the job — partial failures
          # below threshold stay warnings so a single flaky state isn't fatal.
          if [ "$STRICT_COVERAGE" = "1" ]; then
            per_state_cells=$((state_count * 3))
            total_cells=$((per_state_cells + 3))
            broken=$((bk_m + bk_s + mnd_m + mnd_s + nw_m + nw_s))
            [ "$rk_status" != "ok" ] && broken=$((broken + 1))
            [ "$pmms_status_30" != "ok" ] && broken=$((broken + 1))
            [ "$pmms_status_15" != "ok" ] && broken=$((broken + 1))
            # National-fetcher-failed-today is its own breakage, regardless
            # of JSONL staleness — count it so a 100% blocked Rocket day
            # actually counts toward the threshold instead of getting
            # absorbed by yesterday's row passing the recency check.
            [ "$rocket_failed_today" -gt 0 ] && [ "$rk_status" = "ok" ] && broken=$((broken + 1))
            [ "$fred_failed_today" -gt 0 ] && [ "$pmms_status_30" = "ok" ] && broken=$((broken + 1))
            if [ "$total_cells" -gt 0 ]; then
              pct=$(( broken * 100 / total_cells ))
              echo "STRICT_COVERAGE: $broken / $total_cells cells broken ($pct%); threshold $STRICT_THRESHOLD%"
              if [ "$pct" -gt "$STRICT_THRESHOLD" ]; then
                echo "::error::Coverage failure rate $pct% exceeds threshold $STRICT_THRESHOLD% (STRICT_COVERAGE=1)"
                exit 1
              fi
            fi
          fi

      # Long-silence backstop. The fail-soft design keeps the job green even
      # when one whole source is permanently broken (it just logs a per-source
      # failure), so an outage can hide for weeks in "(partial)" commit tags —
      # which is exactly how Rocket froze 2026-06-03 -> 07-05 unnoticed. This
      # flags a source only when its FRESHEST row across all states is past
      # threshold (the whole source is down, not one flaky state), and opens a
      # de-duplicated issue so a long silence becomes loud.
      - name: Check for systemically stale sources
        if: always()
        run: |
          python scripts/check_stale_sources.py --alert-file "$GITHUB_WORKSPACE/.stale-alert.txt" || true
          if [ -s "$GITHUB_WORKSPACE/.stale-alert.txt" ]; then
            echo "STALE_ALERT=1" >> "$GITHUB_ENV"
            {
              echo "## Systemically stale source(s)"
              echo ""
              cat "$GITHUB_WORKSPACE/.stale-alert.txt"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify on long-stale source
        if: always() && github.event_name == 'schedule' && env.STALE_ALERT == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let detail = '';
            try {
              detail = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.stale-alert.txt`, 'utf8').trim();
            } catch (e) { /* no file -> nothing to do */ }
            if (!detail) { core.info('No stale-alert detail; skipping.'); return; }
            const title = 'Data source stale > threshold';
            const body = [
              detail,
              ``,
              `- **Run:** ${runUrl}`,
              `- **Detected:** ${today}`,
              ``,
              `Long-silence backstop: the daily job stays green under fail-soft even`,
              `when a whole source is down, so this issue is the signal that a feed`,
              `has gone dark past threshold. Close it once a later run reports the`,
              `source fresh again.`,
            ].join('\n');
            // De-dup by LABEL. The previous comment here claimed a label
            // filter would miss the first-ever alert because GitHub silently
            // drops an unknown label on create -- that is not what happened:
            // issue #2, the first alert this notifier ever opened, carries the
            // 'stale-source' label. Meanwhile the unfiltered listForRepo it
            // used instead returns PULL REQUESTS as well as issues, and paged
            // at 100, so an unrelated issue backlog could hide the duplicate
            // and open a second one every run. The `!i.pull_request` filter is
            // belt-and-braces for the same API quirk.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'stale-source', per_page: 100,
            });
            const dup = existing.data
              .filter(i => !i.pull_request)
              .find(i => i.title.startsWith('Data source stale'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number,
                body: `Still stale as of ${today}: ${runUrl}\n\n${detail}`,
              });
              core.info(`Appended to existing issue #${dup.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['stale-source', 'automation'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      # The other half of the alarm. Until now nothing anywhere in this repo
      # ever called issues.update({state:'closed'}), so every alarm was
      # one-way: issue #3 sat open across five consecutive GREEN runs and #2's
      # condition had already cleared. An alarm that never clears trains you to
      # ignore it, which defeats the point of raising it.
      #
      # Gated on `github.event_name == 'schedule'` deliberately: a manual
      # workflow_dispatch is often run against a branch or with a partial data
      # tree, and must never be able to declare a production alarm recovered.
      # STALE_ALERT is set by the check step above only when the alert file is
      # non-empty, so `!= '1'` means check_stale_sources.py produced no
      # findings this run.
      - name: Close recovered stale-source issues
        if: always() && github.event_name == 'schedule' && env.STALE_ALERT != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'stale-source', per_page: 100,
            });
            // listForRepo returns PRs too; a PR carrying the label would
            // otherwise be closed by this step.
            const stale = open.data.filter(i => !i.pull_request);
            if (!stale.length) { core.info('No open stale-source issues to close.'); return; }
            for (const issue of stale) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered as of ${today}: check_stale_sources.py reported no findings on this scheduled run.\n\n- **Run:** ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`Closed recovered issue #${issue.number}`);
            }

      - name: Commit refreshed data
        id: commit
        env:
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: 'github-actions[bot]@users.noreply.github.com'
        run: |
          set -e
          git add data/daily src/data public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No data changes today."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Subject tag is driven by the UNEXPECTED count only (computed in
          # "Summarize partial failures"), and NAMES the components. The old
          # "(partial: N failure(s))" counted the permanently-expected `rocket`
          # line, so every single commit carried the tag and the one day it
          # mattered — 2026-07-31, when nerdwallet:maine failed too — read as
          # "(partial: 2 failure(s))" and scrolled past unread.
          fail_summary=""
          if [ "${UNEXPECTED_FAILURE_COUNT:-0}" -gt 0 ]; then
            fail_summary=" (FAILED: ${UNEXPECTED_FAILURE_LIST})"
          fi
          git commit -m "auto: refresh data $(date -u +%Y-%m-%d)${fail_summary}"
          # Push with pull-rebase retry to survive races where another commit
          # lands on main during the ~25min refresh window.
          for i in 1 2 3 4 5; do
            # HEAD:main, not a bare `git push`: after a rebase the branch's
            # upstream can be ambiguous, and being explicit about the refspec
            # means a retry can never push a detached or unexpected ref.
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed; rebasing on origin/main and retrying"
            # `|| true` here left a CONFLICTED rebase in progress: attempts 2-5
            # then died at exit 128 on a detached HEAD and the step reported
            # "Push failed after 5 attempts" — the wrong diagnosis, hiding a
            # conflict behind a retry-exhaustion message. Mirrors the abort
            # path scripts/rocket_residential_refresh.ps1 already uses.
            if ! git pull --rebase origin main; then
              echo "::error::Rebase onto origin/main conflicted; aborting to a clean state. Today's data is not lost — the next scheduled run refetches and recommits it."
              git rebase --abort || true
              exit 1
            fi
            sleep $((i * 4))
          done
          echo "Push failed after 5 attempts"
          exit 1

      # GitHub's GITHUB_TOKEN intentionally does NOT fire downstream workflows
      # on the `push` event triggered by its own commits — a security feature
      # to prevent infinite workflow loops. That means our auto-refresh pushes
      # never trigger deploy.yml, so GH Pages keeps serving the bundle built
      # at the last *human* push. The page's bundled JSON data layers (PMMS
      # weekly, NW daily, etc. — all eager-imported via Vite's import.meta.glob)
      # therefore go stale on the live site even though origin/main has fresh
      # data. workflow_dispatch IS allowed via GITHUB_TOKEN, so explicitly
      # triggering the deploy after a successful data push fixes that.
      #
      # The dispatch was a SINGLE un-retried API call, and it is the only thing
      # standing between fresh data on origin/main and the live site. On
      # 2026-08-04 it returned 503; the pipeline stayed green and Pages served
      # a three-day-old bundle until someone noticed on 08-07. Retry it, and
      # fail the job if all three attempts miss — a failed dispatch means the
      # data we just pushed will never reach users, which is not a green
      # outcome. (The `failure()` notifier at the end of this job then opens an
      # issue, and deploy.yml carries its own notifier for the case where the
      # dispatch lands but the build or deploy-pages step dies.)
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            if gh workflow run deploy.yml --ref main; then
              echo "Pages deploy dispatched on attempt $i"
              exit 0
            fi
            echo "Dispatch attempt $i failed"
            # `if`, not `[ ... ] && sleep`: on the last iteration the test is
            # false, the compound returns 1, and the runner's `bash -e` would
            # abort the step before the ::error:: below ever printed.
            if [ "$i" -lt 3 ]; then sleep $((i * 10)); fi
          done
          echo "::error::Failed to dispatch deploy.yml after 3 attempts — data is pushed to main but the live site will keep serving the previous bundle."
          exit 1

      # Opens a GitHub issue when a *scheduled* (cron) run fails. Manual
      # (workflow_dispatch) runs are exempt because the human invoker is
      # already watching the logs. De-duplicated by title — if a refresh-
      # failed issue from a previous day is still open, append a comment
      # instead of opening a duplicate. This makes overnight failures
      # visible in the repo's Issues tab instead of dying silently.
      - name: Notify on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `Daily refresh failed (${today})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Scheduled daily refresh failed.`,
              ``,
              `- **Run:** ${runUrl}`,
              `- **Triggered by:** ${context.eventName}`,
              `- **SHA:** ${context.sha}`,
              ``,
              `Check the run's "Validate daily coverage" step summary for the per-source breakdown.`,
              `If this is intermittent (transient HTTP / bot challenge), close this issue once the next run is green.`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'daily-refresh-failure',
              per_page: 50,
            });
            // listForRepo returns pull requests alongside issues; a PR that
            // happened to carry the label would be treated as the duplicate
            // and get the comment instead of the issue.
            const dup = existing.data
              .filter(i => !i.pull_request)
              .find(i => i.title.startsWith('Daily refresh failed'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Another failure: ${runUrl}`,
              });
              core.info(`Appended comment to existing issue #${dup.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['daily-refresh-failure', 'automation'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      # Mirror of the stale-source auto-close, for the failure notifier above.
      # `if: success()` means every earlier step in this job passed, so the
      # condition the open issue describes has demonstrably cleared. Restricted
      # to scheduled runs for the same reason as the other closer: a manual
      # dispatch can be run against a branch or a partial tree and must not be
      # able to silence a production alarm.
      - name: Close refresh-failure issues on a green scheduled run
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'daily-refresh-failure', per_page: 50,
            });
            const issues = open.data.filter(i => !i.pull_request);
            if (!issues.length) { core.info('No open daily-refresh-failure issues to close.'); return; }
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered as of ${today}: the scheduled daily refresh completed successfully.\n\n- **Run:** ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`Closed recovered issue #${issue.number}`);
            }
